apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ferretdbusers.k8s.ftechmax.net
spec:
  group: k8s.ftechmax.net
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: State
          type: string
          jsonPath: .status.state
          description: Current state of the user
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: "self.spec.secret == self.metadata.name"
              message: "spec.secret must match metadata.name"
          properties:
            spec:
              type: object
              required:
                - database
                - secret
              properties:
                database:
                  type: string
                  maxLength: 63
                  pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
                  description: PostgreSQL identifier (letters, digits, underscore; cannot start with a digit)
                  x-kubernetes-validations:
                    - rule: "oldSelf.hasValue() ? self == oldSelf.value() : true"
                      message: "spec.database is immutable"
                      optionalOldSelf: true
                secret:
                  type: string
                usernameKey:
                  type: string
                  description: Key in the secret for the username
                  default: database_username
                passwordKey:
                  type: string
                  description: Key in the secret for the password
                  default: database_password
                roles:
                  type: array
                  items:
                    type: string
                  default: []
            status:
              type: object
              properties:
                state:
                  type: string
                  description: State of the created user (Creating, Ready, Error)
      subresources:
        status: {}
  scope: Namespaced
  names:
    plural: ferretdbusers
    singular: ferretdbuser
    kind: FerretDbUser
    shortNames:
      - fdbu
